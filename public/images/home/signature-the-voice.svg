<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" role="img" aria-labelledby="t d">
<title id="t">The Voice — ALBARAA background signature character</title>
<desc id="d">A refined hand-drawn editorial male character presenting with a microphone and an expressive raised hand.</desc>
<style>
  :root { --paper:#F5F2EA; --ink:#081126; --cyan:#00C2E6; --mist:#8A93A7; }
  .paper { fill:var(--paper); }
  .ink { fill:var(--ink); }
  .line { fill:none; stroke:var(--paper); stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
  .detail { fill:none; stroke:var(--ink); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
  .fine { fill:none; stroke:var(--ink); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
  .cyan { fill:var(--cyan); }
  .cyan-line { fill:none; stroke:var(--cyan); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
</style>
<!-- transparent production illustration: no background and no grid -->
<g id="voice-character">
